<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    @font-face {
      font-family: 'STSongti-SC-Bold';
      src: url('https://cdn-cos.coach.com.cn/uploads/fonts/STSongti-SC-Bold.ttf');
    }
    @font-face {
      font-family: 'STSongti-SC-Regular';
      src: url('https://cdn-cos.coach.com.cn/uploads/fonts/STSongti-SC-Regular.ttf');
    }
    * {
      margin: 0;
      padding: 0;
      font-family: STSongti-SC-Regular;
      font-size: 14px;
      line-height: 20px;
    }
    .footer {
      /* background-color: rgba(0,0,0,0.05); */
      text-align: center;
      font-size: 12px;
      color: #000;
      position: relative;
      height: 70px;
      width: 100%;
    }
    .icon  {
      position: absolute;
      top: 0;
      left: 0;
      width: 76px;
      height: 30px;
    }
    .italic {
      font-style: italic;
    }

    .bold {
      font-weight: bold;
      font-family: STSongti-SC-Bold;
    }

    .center {
      text-align: center;
      line-height: 30px;
    }
  </style>
</head>
<body>
  <div class="footer">
    <img class="icon" src="https://cdn-cos.coach.com.cn/static/admin/logo.png" alt="">
    <div class="center">
      <span class="bold">{{.CreatorDeptName}}</span>
      <span> · </span>
      <span class="italic">{{.CreatorName}}</span>
    </div>
  </div>
</body>
</html>
