<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    @font-face {
      font-family: 'STSongti-SC-Bold';
      src: url('https://cdn-cos.coach.com.cn/uploads/fonts/STSongti-SC-Bold.ttf');
    }
    @font-face {
      font-family: 'STSongti-SC-Regular';
      src: url('https://cdn-cos.coach.com.cn/uploads/fonts/STSongti-SC-Regular.ttf');
    }
    * {
      margin: 0;
      padding: 0;
      font-family: STSongti-SC-Regular;
      font-size: 14px;
      line-height: 28px;
    }
    .cover {
      height: 1250px;
      position: relative;
      padding-left: 300px;
      /* background-color: aqua; */
      overflow: hidden;
    }

    .font-16 {
      font-size: 16px;
      line-height: 24px;
    }

    .font-24 {
      font-size: 24px;
      line-height: 38px;
      margin-top: 4px;
    }

    .bold {
      font-weight: bold;
      font-family: STSongti-SC-Bold;
    }

    .italic {
      font-style: italic;
    }

    .time {
      font-weight: 700;
      margin-top: 28px;
    }

    .img {
      width: 300px;
      height: 1250px;
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
    }

    .cover-content {
      position: relative;
      width: 100%;
      height: 100%;
    }
    .logo {
      position: absolute;
      top: 0;
      left: 46px;
      width: 76px;
      height: 30px;
      display: block;
    }

    .main {
      position: absolute;
      top: 500px;
      left: 46px;
    }

    .cover-footer {
      position: absolute;
      top: 1200px;
      left: 46px;
    }
    

  </style>
</head>
<body>
  <div class="cover">
    <img class="img" src="https://cdn-cos.coach.com.cn/static/admin/1.png" alt="">
    <div class="cover-content">
      <img class="logo" src="https://cdn-cos.coach.com.cn/static/admin/logo.png" alt="">
      <div class="main">
        <div class="font-16 bold">Store Visit Report</div>
        <div class="font-24 bold">{{.Name}}巡店报告</div>
        <div class="time">
          <div>巡店时间: {{.StoreVisitTime}}</div>
          <div>报告时间: {{.ReportTime}}</div>
        </div>
      </div>
      <div class="cover-footer">
        <span class="bold">{{.CreatorDeptName}}</span>
        <span> · </span>
        <span class="italic">{{.CreatorName}}</span>
      </div>
    </div>
  </div>
</body>
</html>
