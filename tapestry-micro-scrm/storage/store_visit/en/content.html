<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    @font-face {
      font-family: 'STSongti-SC-Bold';
      src: url('https://cdn-cos.coach.com.cn/uploads/fonts/STSongti-SC-Bold.ttf');
    }
    @font-face {
      font-family: 'STSongti-SC-Regular';
      src: url('https://cdn-cos.coach.com.cn/uploads/fonts/STSongti-SC-Regular.ttf');
    }
    * {
      font-family: STSongti-SC-Regular;
      font-size: 14px;
      line-height: 28px;
      font-weight: 400;
    }
    .content {
      /* padding-left: 196px; */
      position: relative;
    }
    h3 {
      font-size: 16px;
    }
    h4 {
      font-size: 15px;
    }
    .bold,
    strong,
    strong * {
      font-weight: bold !important;
      font-family: STSongti-SC-Bold !important;
    }

    .side {
      width: 150px;
      position: absolute;
      left: 0;
      top: 0;
    }
    
    .main {
      flex: 1;
    }

    .item {
      margin-bottom: 20px;
    }

    .item-content {
      margin-top: 8px;
    }

    .item-image {
      width: 320px;
      height: 320px;
      /* object-fit: contain; */
    }

    .item-a {
      width: 320px;
      height: 320px;
      margin-top: 12px;
      margin-right: 12px;
      position: relative;
      overflow: hidden;
      text-decoration: none;
    }

    .item-tag {
      position: absolute;
      background-color: rgba(220, 210, 195, 1);
      bottom: 2px;
      left: 0;
      height: 20px;
      line-height: 20px;
      font-size: 12px;
      padding: 0 10px;
      color: #000;
      font-weight: 500;
      text-decoration: none;
    }

    .mt-2 {
      margin-top: 16px;
    }

    .mt-3 {
      margin-top: 24px;
    }

    .mt-1 {
      margin-top: 8px;
    }

    .pl-5 {
      padding-left: 5px;
    }
    .f-15 {
      font-size: 15px;
    }
    .f-16 {
      font-size: 16px;
    }

    .relative {
      position: relative;
      z-index: 1;
    }

    .absolute {
      position: absolute;
      /* height: 20px; */
      background-color: #f7cf46; 
      top: -5px;
      bottom: 1px;
      left: -5px;
      right: -5px;
    }
  </style>
</head>
<body>
  <div class="content">
    <!-- 概览 -->
    <span class="relative">
      <span class="relative pl-5 f-16 bold">Overview</span>
      <div class="absolute"></div>
    </span>
    <div class="mt-1">{{.Overview}}</div>

    <!-- 反馈记录 -->
    <div class=" mt-3">
      <span class="relative">
        <span class="relative pl-5 f-16 bold">Visit Record</span>
        <div class="absolute"></div>
      </span>
    </div>
    {{range .ShowRecordList}}
    {{$typeName := .TypeName}}
    <div class="mt-1">
      <h4 class="bold">{{$typeName}}</h4>
      <div class="mt-1">
        <!-- 反馈文本内容 -->
        <div class="item-text">{{.Content | safeHTML}}</div>
        <!-- 循环渲染图片 -->
        {{range .MediaList}}

        <a class="item-a" href="{{.URL}}">

          <img class="item-image" src="{{.ThumbUrl}}"/>
          <div class="item-tag">{{$typeName}}</div>
        </a>
        {{end}}
      </div>
    </div>
    {{end}}
  
  </div>
</body>
</html>
